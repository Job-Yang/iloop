name: selftest

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  selftest:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Run iLoop selftest (kernel + iOS plugin command assembly)
        run: python3 -m host_cli selftest
      - name: Run managed-host fresh clone journey
        run: python3 scripts/fresh_clone_smoke.py
